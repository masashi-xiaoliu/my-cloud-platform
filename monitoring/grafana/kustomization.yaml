# Grafana の sidecar は label grafana_dashboard=1 の ConfigMap を自動で読み込む。
# ダッシュボード JSON を Git で管理 → Argo CD で同期 → Grafana に反映、という GitOps 運用。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: dashboard-hello-go
    files:
      - dashboards/hello-go.json
