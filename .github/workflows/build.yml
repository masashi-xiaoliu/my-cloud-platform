# Build: コンテナイメージを作って GHCR (GitHub Container Registry) に push し、dev へのデプロイを起動する。
#   自動: main の apps/hello-go/** が変わったとき / v*.*.* タグを push したとき
#   手動: Actions > Build > Run workflow > version に v1.1.0 などを入力
name: Build

on:
  push:
    branches: [main]
    paths: ["apps/hello-go/**"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "イメージタグ（例: v1.1.0）。空なら sha-<短縮SHA>"
        required: false
        default: ""
      deploy_to_dev:
        description: "ビルド後に dev へデプロイする"
        type: boolean
        default: true

permissions:
  contents: write        # deploy.yml が overlay を書き換えて push するため
  packages: write        # GHCR への push
  pull-requests: write

jobs:
  build:
    name: Build & Push image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide image name & tag
        id: tag
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ -n "${{ inputs.version }}" ]; then tag="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"
          else tag="sha-$(echo ${{ github.sha }} | cut -c1-7)"; fi
          echo "image=ghcr.io/$owner/hello-go" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "### Image: \`ghcr.io/$owner/hello-go:$tag\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build & push    # 成功すると GitHub > Packages に hello-go が表示される
        uses: docker/build-push-action@v6
        with:
          context: apps/hello-go
          push: true
          build-args: VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to dev
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_to_dev
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image_tag: ${{ needs.build.outputs.tag }}
    secrets: inherit
