# Terraform Plan (GCP dev): PR で terraform/ が変わったら plan を実行し、結果を Job Summary に出す。
# apply は人がローカルで実行する（docs/adr/0005 参照）。
# 前提: Repository variables に GCP_PROJECT_ID / GCP_WIF_PROVIDER / GCP_SA_EMAIL を設定（docs/phases/phase-07-gcp.md）。
name: Terraform Plan

on:
  pull_request:
    paths: ["terraform/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Workload Identity Federation（鍵ファイルなしで GCP 認証）

jobs:
  plan:
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform init -input=false -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"
      - name: terraform plan
        id: plan
        run: terraform plan -input=false -no-color -var="project_id=${{ vars.GCP_PROJECT_ID }}" | tee plan.txt
      - name: Summary
        if: always()
        run: |
          echo '### terraform plan (dev)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(Plan:|No changes|  # )' plan.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
