# CI: 「マージしてよいか」を判定するワークフロー。PR と push のたびに実行される。
# 手動実行: GitHub > Actions > CI > Run workflow
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- app
  test:
    name: Test (hello-go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hello-go
    steps:
      - name: Checkout            # リポジトリのコードを Runner に取得
        uses: actions/checkout@v4
      - name: Setup Go            # go.mod の go バージョンをインストール
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/hello-go/go.mod
      - name: Format check        # gofmt で整形されていないファイルがあれば失敗
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet                 # 静的解析
        run: go vet ./...
      - name: Run tests           # ★ LAB C02: テストを壊すとここが赤くなる
        run: go test -race -cover ./...

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker build        # Dockerfile が壊れていないかだけ確認（push はしない）
        uses: docker/build-push-action@v6
        with:
          context: apps/hello-go
          push: false
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- manifests
  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize & kubeconform
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kustomize kubeconform /usr/local/bin/
          pip install pyyaml
      - name: Build & validate overlays   # ★ LAB C03: YAML を壊すとここが赤くなる
        run: |
          for env in local dev staging prod; do
            echo "::group::overlay $env"
            kustomize build kubernetes/overlays/$env > /tmp/$env.yaml
            kubeconform -strict -summary -ignore-missing-schemas /tmp/$env.yaml
            python3 scripts/check-manifests.py < /tmp/$env.yaml
            echo "::endgroup::"
          done
      - name: Validate Argo CD apps
        run: kustomize build argocd/applications > /dev/null

  # ---------------------------------------------------------------- terraform
  terraform:
    name: Terraform fmt / validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: terraform fmt     # ★ LAB TF: インデントを崩すとここが赤くなる
        run: terraform fmt -check -recursive terraform
      - name: terraform validate
        run: |
          for env in local dev prod; do
            echo "::group::$env"
            terraform -chdir=terraform/environments/$env init -backend=false -input=false
            terraform -chdir=terraform/environments/$env validate
            echo "::endgroup::"
          done
