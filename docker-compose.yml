# Phase 1-2: ローカルで「Kubernetes なし」に動かすための構成。
# 起動:   docker compose up --build
# 確認:   curl http://localhost:8080/   と   curl http://localhost:8080/info
# 停止:   docker compose down
services:
  hello-go:
    build:
      context: ./apps/hello-go
      args:
        VERSION: v0.0.0-local
    ports:
      - "8080:8080"
    environment:
      # ★ LAB (T01-local): ここを書き換えて `docker compose up -d` し直すと、レスポンスが変わる。
      APP_MESSAGE: "Hello from My Cloud Platform"
      APP_ENV: local
      LOG_LEVEL: debug
      REQUEST_TIMEOUT: 5s
      MAX_RETRY: "3"
      ERROR_RATE: "0"
      LATENCY_MS: "0"
    healthcheck:
      # distroless にはシェルも curl もないため、compose では healthcheck を書かない代わりに
      # ホスト側から `curl localhost:8080/healthz` で確認する。
      disable: true

  # 20% 側の差し替え例（Phase 10）。`docker compose --profile fastapi up --build`
  fastapi:
    profiles: ["fastapi"]
    build: ./apps/fastapi
    ports:
      - "8081:8080"
    environment:
      APP_MESSAGE: "Hello from FastAPI on My Cloud Platform"
