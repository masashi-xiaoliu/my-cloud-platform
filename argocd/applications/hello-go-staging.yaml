apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-go-staging
  namespace: argocd
  labels:
    environment: staging
spec:
  project: my-cloud-platform
  source:
    repoURL: https://github.com/masashi-xiaoliu/my-cloud-platform.git
    # ★ LAB I14: 監視するブランチ。存在しないブランチ名にすると ComparisonError。
    targetRevision: main
    path: kubernetes/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
