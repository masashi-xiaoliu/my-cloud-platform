# Grafana のダッシュボード（ConfigMap）も GitOps で管理する。Phase 8 で有効化。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-dashboards
  namespace: argocd
spec:
  project: my-cloud-platform
  source:
    repoURL: https://github.com/masashi-xiaoliu/my-cloud-platform.git
    targetRevision: main
    path: monitoring/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
