# overlays/local — Phase 3 で「手で」適用する環境（Argo CD を使わない）。
# 適用: kubectl apply -k kubernetes/overlays/local
# イメージは kind load docker-image hello-go:v0.0.0-local でクラスタに直接読み込む（Registry 不要）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-local

resources:
  - namespace.yaml
  - ../../base

# ★ LAB T08: デプロイするイメージ。CD (deploy.yml) が newTag を書き換えてコミットする。
# 手で存在しないタグ（例: v999.0.0）にすると ImagePullBackOff（Incident Lab I02）。
images:
  - name: hello-go
    newName: hello-go
    newTag: v0.0.0-local

configMapGenerator:
  - name: hello-go-config
    behavior: merge
    envs:
      - config.env

secretGenerator:
  - name: hello-go-secret
    envs:
      - secret.env

patches:
  - path: patch-deployment.yaml
  - path: patch-ingress.yaml
    target:
      kind: Ingress
      name: hello-go


