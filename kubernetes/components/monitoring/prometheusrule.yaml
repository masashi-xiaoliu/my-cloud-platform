apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hello-go
spec:
  groups:
    - name: hello-go.rules
      rules:
        - alert: HelloGoHighErrorRate
          # ★ LAB M06: 閾値と for を調整して「鳴りすぎ / 鳴らなさすぎ」を体験する。
          expr: |
            sum(rate(http_requests_total{job="hello-go",code=~"5.."}[2m]))
              / clamp_min(sum(rate(http_requests_total{job="hello-go"}[2m])), 0.001) > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "hello-go の 5xx 率が 5% を超えています"
            runbook: "docs/labs/incident/I07-application-error.md"
        - alert: HelloGoHighLatencyP95
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="hello-go",path="/"}[5m]))) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "hello-go の p95 レイテンシが 500ms を超えています"
        - alert: HelloGoPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{container="hello-go"}[10m]) > 3
          labels:
            severity: critical
          annotations:
            summary: "hello-go の Pod が再起動を繰り返しています (CrashLoopBackOff の可能性)"
            runbook: "docs/labs/incident/I01-crashloopbackoff.md"
