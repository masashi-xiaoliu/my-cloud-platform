apiVersion: v1
kind: Service
metadata:
  name: hello-go
spec:
  type: ClusterIP
  selector: {}   # app.kubernetes.io/name: hello-go が kustomize の labels で自動付与される
  ports:
    - name: http
      # ★ LAB T13: Service の port（クラスタ内からアクセスするポート）
      port: 80
      # ★ LAB T13: targetPort（Pod 側のポート）。名前 "http" は Deployment の ports.name を指す。
      targetPort: http
